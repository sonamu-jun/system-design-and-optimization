<svg xmlns="http://www.w3.org/2000/svg" width="512" height="280" viewBox="0 0 512 280" role="img" aria-labelledby="title description">
<title id="title">A complete tour includes the return trip</title>
<desc id="description">The open route 2, 4, 3, 1, 0 costs 11 and is incomplete. The same route with the return edge from 0 to 2 costs 20 and is feasible.</desc>
<rect width="512" height="280" fill="#fff"/>
<defs>
  <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#286d9b"/></marker>
  <marker id="arrow-gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#697582"/></marker>
  <marker id="arrow-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b86522"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#253c4c">
<text x="16" y="24" fill="#697582" text-anchor="start" font-weight="normal">Open route</text>
<text x="496" y="24" fill="#697582" text-anchor="end" font-weight="normal">11 distance units</text>
<path d="M 59 65 L 127 65" fill="none" stroke="#697582" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<text x="94.0" y="55" fill="#697582" text-anchor="middle" font-weight="normal">3</text>
<path d="M 167 65 L 235 65" fill="none" stroke="#697582" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<text x="202.0" y="55" fill="#697582" text-anchor="middle" font-weight="normal">1</text>
<path d="M 275 65 L 343 65" fill="none" stroke="#697582" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<text x="310.0" y="55" fill="#697582" text-anchor="middle" font-weight="normal">5</text>
<path d="M 383 65 L 451 65" fill="none" stroke="#697582" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<text x="418.0" y="55" fill="#697582" text-anchor="middle" font-weight="normal">2</text>
<circle cx="40" cy="65" r="17" fill="#fff" stroke="#697582" stroke-width="1.8"/>
<text x="40" y="70" fill="#697582" text-anchor="middle" font-weight="normal">2</text>
<circle cx="148" cy="65" r="17" fill="#fff" stroke="#697582" stroke-width="1.8"/>
<text x="148" y="70" fill="#697582" text-anchor="middle" font-weight="normal">4</text>
<circle cx="256" cy="65" r="17" fill="#fff" stroke="#697582" stroke-width="1.8"/>
<text x="256" y="70" fill="#697582" text-anchor="middle" font-weight="normal">3</text>
<circle cx="364" cy="65" r="17" fill="#fff" stroke="#697582" stroke-width="1.8"/>
<text x="364" y="70" fill="#697582" text-anchor="middle" font-weight="normal">1</text>
<circle cx="472" cy="65" r="17" fill="#fff" stroke="#697582" stroke-width="1.8"/>
<text x="472" y="70" fill="#697582" text-anchor="middle" font-weight="normal">0</text>
<text x="16" y="158" fill="#177b70" text-anchor="start" font-weight="normal">Closed tour</text>
<text x="496" y="158" fill="#177b70" text-anchor="end" font-weight="normal">20 distance units</text>
<path d="M 59 199 L 127 199" fill="none" stroke="#286d9b" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="94.0" y="189" fill="#286d9b" text-anchor="middle" font-weight="normal">3</text>
<path d="M 167 199 L 235 199" fill="none" stroke="#286d9b" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="202.0" y="189" fill="#286d9b" text-anchor="middle" font-weight="normal">1</text>
<path d="M 275 199 L 343 199" fill="none" stroke="#286d9b" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="310.0" y="189" fill="#286d9b" text-anchor="middle" font-weight="normal">5</text>
<path d="M 383 199 L 451 199" fill="none" stroke="#286d9b" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="418.0" y="189" fill="#286d9b" text-anchor="middle" font-weight="normal">2</text>
<circle cx="40" cy="199" r="17" fill="#fff" stroke="#286d9b" stroke-width="1.8"/>
<text x="40" y="204" fill="#286d9b" text-anchor="middle" font-weight="normal">2</text>
<circle cx="148" cy="199" r="17" fill="#fff" stroke="#286d9b" stroke-width="1.8"/>
<text x="148" y="204" fill="#286d9b" text-anchor="middle" font-weight="normal">4</text>
<circle cx="256" cy="199" r="17" fill="#fff" stroke="#286d9b" stroke-width="1.8"/>
<text x="256" y="204" fill="#286d9b" text-anchor="middle" font-weight="normal">3</text>
<circle cx="364" cy="199" r="17" fill="#fff" stroke="#286d9b" stroke-width="1.8"/>
<text x="364" y="204" fill="#286d9b" text-anchor="middle" font-weight="normal">1</text>
<circle cx="472" cy="199" r="17" fill="#fff" stroke="#286d9b" stroke-width="1.8"/>
<text x="472" y="204" fill="#286d9b" text-anchor="middle" font-weight="normal">0</text>
<text x="16" y="113" fill="#697582" text-anchor="start" font-weight="normal">Missing return trip: incomplete route</text>
<path d="M 472 218 C 472 248 455 248 434 248 L 78 248 C 56 248 40 248 40 218" fill="none" stroke="#b86522" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
<rect x="207" y="235" width="98" height="25" rx="0" fill="#fff" stroke="none"/>
<text x="256" y="253" fill="#b86522" text-anchor="middle" font-weight="normal">Return: 9</text>
</g>
</svg>
