<text x="464.0" y="188" fill="#253c4c" text-anchor="middle">2.0</text>
<circle cx="324.0" cy="161" r="6" fill="#b86522"/>
<text x="16" y="227" fill="#253c4c" text-anchor="start">Limit: 2.0 min</text>
<text x="496" y="227" fill="#177b70" text-anchor="end">μ = 0 · inactive</text>
<path d="M 44 261 L 476 261" fill="none" stroke="#697582" stroke-width="2"/>
