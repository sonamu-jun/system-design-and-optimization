<svg xmlns="http://www.w3.org/2000/svg" width="480" height="208" viewBox="0 0 480 208" role="img" aria-labelledby="title description">
  <title id="title">Feasible movement at the upper correction bound</title>
  <desc id="description">Along calibration r equals 1 minus q. At q equal to the upper bound, a move toward smaller q and larger r is feasible. A move toward larger q and smaller r is forbidden.</desc>
  <rect width="480" height="208" fill="#fff"/>
  <defs>
    <marker id="allowed-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#168578"/></marker>
    <marker id="forbidden-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#707070"/></marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#253c4c">
    <text x="134" y="28" text-anchor="middle" fill="#168578">Feasible</text>
    <text x="356" y="28" text-anchor="middle" fill="#707070">Forbidden</text>
    <text x="134" y="53" text-anchor="middle">q decreases, r increases</text>
    <text x="356" y="53" text-anchor="middle">q increases, r decreases</text>
    <path d="M 238 82 L 52 82" stroke="#168578" stroke-width="2.5" marker-end="url(#allowed-arrow)"/>
    <path d="M 260 82 L 444 82" stroke="#707070" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#forbidden-arrow)"/>
    <path d="M 30 111 L 250 111" stroke="#168578" stroke-width="3"/>
    <path d="M 250 111 L 450 111" stroke="#707070" stroke-width="2"/>
    <path d="M 250 67 L 250 130" stroke="#707070" stroke-width="1.3"/>
    <circle cx="250" cy="111" r="6" fill="#e78b24"/>
    <text x="250" y="155" text-anchor="middle">q = q<tspan baseline-shift="sub" font-size="12">max</tspan></text>
    <text x="240" y="192" text-anchor="middle">Correction q (min); r = 1 − q along calibration</text>
  </g>
</svg>
