<svg xmlns="http://www.w3.org/2000/svg" width="520" height="146" viewBox="0 0 520 146" role="img">
<title>At q equals 1, the slope term minus 6 and bound term plus 6 cancel.</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="14" fill="#243344">
<text x="116" y="30" fill="#2878b5" text-anchor="middle">Slope p′(1) = −6</text>
<text x="399" y="30" fill="#168578" text-anchor="middle">Bound μ = +6</text>
<line x1="72" y1="70" x2="448" y2="70" stroke="#d7dfe7" stroke-width="1.5" />
<line x1="260" y1="49" x2="260" y2="88" stroke="#707070" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="256" y1="70" x2="84" y2="70" stroke="#2878b5" stroke-width="3" />
<path d="M 92,65 L 84,70 L 92,75" fill="none" stroke="#2878b5" stroke-width="2"/>
<line x1="264" y1="70" x2="436" y2="70" stroke="#168578" stroke-width="3" />
<path d="M 428,65 L 436,70 L 428,75" fill="none" stroke="#168578" stroke-width="2"/>
<text x="260" y="111" fill="#243344" text-anchor="middle">−6 + 6 = 0</text>
<text x="260" y="135" fill="#707070" text-anchor="middle">Stationarity: the two terms cancel</text>
</g></svg>
