<svg xmlns="http://www.w3.org/2000/svg" width="440" height="398" viewBox="0 0 440 398"><rect width="440" height="398" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke"/></marker></defs><rect x="105" y="6" width="230" height="34" rx="5" fill="white" stroke="#2078ba" stroke-width="1.6"/><text x="220" y="29" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="16" fill="#2078ba">Start with candidates</text><path d="M220 44 L220 64" fill="none" stroke="#737b85" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="65" width="390" height="280" rx="5" fill="white" stroke="#737b85" stroke-width="1.6"/><text x="220" y="89" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="16" fill="#7954a8">Repeat generations times</text><rect x="60" y="103" width="320" height="32" rx="5" fill="white" stroke="#2078ba" stroke-width="1.6"/><text x="220" y="125" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="16" fill="#2078ba">Rank by score; keep elites</text><rect x="60" y="162" width="320" height="32" rx="5" fill="white" stroke="#198568" stroke-width="1.6"/><text x="220" y="184" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="16" fill="#198568">Selection: choose from top k</text><rect x="60" y="221" width="320" height="32" rx="5" fill="white" stroke="#c96516" stroke-width="1.6"/><text x="220" y="243" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="16" fill="#c96516">Crossover + mutation → child</text><rect x="60" y="300" width="320" height="32" rx="5" fill="white" stroke="#2078ba" stroke-width="1.6"/><text x="220" y="322" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="16" fill="#2078ba">Replace the population</text><path d="M220 138 L220 158" fill="none" stroke="#737b85" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 197 L220 217" fill="none" stroke="#737b85" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="277" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="16" fill="#252b32">Repeat until the next population is full</text><path d="M220 281 L220 296" fill="none" stroke="#737b85" stroke-width="2" marker-end="url(#arrow)"/><path d="M220 349 L220 361" fill="none" stroke="#737b85" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="364" width="230" height="32" rx="5" fill="white" stroke="#2078ba" stroke-width="1.6"/><text x="220" y="386" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="16" fill="#2078ba">Return the best</text></svg>
