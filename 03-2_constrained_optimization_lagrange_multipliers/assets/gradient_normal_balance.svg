<svg xmlns="http://www.w3.org/2000/svg" width="512" height="292" viewBox="0 0 512 292" role="img" aria-labelledby="title description">
  <title id="title">Both gradients are normal to the calibration line</title>
  <desc id="description">At the constrained clock minimum, the constraint gradient (1, 1) and objective gradient (-2, -2) point in opposite directions. A tangent change follows the calibration line and is perpendicular to both gradients.</desc>
  <rect width="512" height="292" fill="white"/>
  <defs>
    <marker id="normal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 8,4 L 0,8" fill="none" stroke="#168578" stroke-width="1.5"/></marker>
    <marker id="objective" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 8,4 L 0,8" fill="none" stroke="#c57522" stroke-width="1.5"/></marker>
    <marker id="decision" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 8,4 L 0,8" fill="none" stroke="#2878b5" stroke-width="1.5"/></marker>
  </defs>
  <g font-family="DejaVu Sans, sans-serif" font-size="14" fill="#243344">
    <path d="M 178,36 L 390,248" fill="none" stroke="#168578" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="20" y="43" fill="#168578">Calibration: h = 0</text>
    <path d="M 148,42 L 179,42" fill="none" stroke="#707070"/>
    <path d="M 280,138 L 346,72" fill="none" stroke="#168578" stroke-width="2.5" marker-end="url(#normal)"/>
    <text x="358" y="64" fill="#168578">∇h = (1, 1)</text>
    <path d="M 280,138 L 148,270" fill="none" stroke="#c57522" stroke-width="2.5" marker-end="url(#objective)"/>
    <text x="18" y="255" fill="#c57522">∇φ = (−2, −2)</text>
    <path d="M 280,138 L 350,208" fill="none" stroke="#2878b5" stroke-width="2.5" marker-end="url(#decision)"/>
    <text x="362" y="212" fill="#2878b5">Allowed δx</text>
    <path d="M 292,126 L 304,138 L 292,150" fill="none" stroke="#707070" stroke-width="1.3"/>
    <circle cx="280" cy="138" r="4" fill="#c57522"/>
    <text x="168" y="130">x* = (1.5, −0.5)</text>
  </g>
</svg>
