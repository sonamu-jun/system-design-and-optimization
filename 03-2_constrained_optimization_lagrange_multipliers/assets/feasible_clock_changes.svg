<title id="title">Only an allowed improvement can be accepted</title><desc id="description">From correction 1 and rate 0 with score 2, a move to correction 1.1 and rate minus 0.1 is feasible with score 1.46. A move to correction 1 and rate minus 0.1 has score 1.54 but violates exact calibration.</desc>
