<svg xmlns="http://www.w3.org/2000/svg" width="520" height="354" viewBox="0 0 520 354" role="img">
<title>GD evaluates and records, checks slope and update limit, then updates q and advances the iteration counter.</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="14" fill="#243344">
<rect x="62" y="8" width="296" height="34" rx="7" stroke="#2878b5" fill="#f2f7fb"/>
<text x="210" y="30" fill="#2878b5" text-anchor="middle">q = start; k = 0</text>
<line x1="210" y1="42" x2="210" y2="64" stroke="#707070" stroke-width="1.8" />
<path d="M 214.0,57.0 L 210,64 L 206.0,57.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<rect x="62" y="64" width="296" height="58" rx="7" stroke="#707070" fill="white"/>
<text x="210" y="87" fill="#243344" text-anchor="middle">Calculate score and slope</text>
<text x="210" y="109" fill="#707070" text-anchor="middle">Record k, q, score, slope</text>
<line x1="210" y1="122" x2="210" y2="146" stroke="#707070" stroke-width="1.8" />
<path d="M 214.0,139.0 L 210,146 L 206.0,139.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<rect x="62" y="146" width="296" height="34" rx="7" stroke="#8854a5" fill="#faf6fc"/>
<text x="210" y="168" fill="#8854a5" text-anchor="middle">Small slope?</text>
<line x1="358" y1="163" x2="395" y2="163" stroke="#707070" stroke-width="1.8" />
<path d="M 388.0,159.0 L 395,163 L 388.0,167.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<text x="377" y="154" fill="#707070" text-anchor="middle">yes</text>
<rect x="397" y="142" width="112" height="46" rx="7" stroke="#168578" fill="white"/>
<text x="453" y="161" fill="#168578" text-anchor="middle">Stop</text>
<text x="453" y="179" fill="#707070" text-anchor="middle">small slope</text>
<line x1="210" y1="180" x2="210" y2="204" stroke="#707070" stroke-width="1.8" />
<path d="M 214.0,197.0 L 210,204 L 206.0,197.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<text x="225" y="197" fill="#707070" text-anchor="start">no</text>
<rect x="62" y="204" width="296" height="34" rx="7" stroke="#8854a5" fill="#faf6fc"/>
<text x="210" y="226" fill="#8854a5" text-anchor="middle">Update limit?</text>
<line x1="358" y1="221" x2="395" y2="221" stroke="#707070" stroke-width="1.8" />
<path d="M 388.0,217.0 L 395,221 L 388.0,225.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<text x="377" y="212" fill="#707070" text-anchor="middle">yes</text>
<rect x="397" y="200" width="112" height="46" rx="7" stroke="#168578" fill="white"/>
<text x="453" y="219" fill="#168578" text-anchor="middle">Stop</text>
<text x="453" y="237" fill="#707070" text-anchor="middle">update limit</text>
<line x1="210" y1="238" x2="210" y2="262" stroke="#707070" stroke-width="1.8" />
<path d="M 214.0,255.0 L 210,262 L 206.0,255.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<text x="225" y="255" fill="#707070" text-anchor="start">no</text>
<rect x="62" y="262" width="296" height="60" rx="7" stroke="#2878b5" fill="#f2f7fb"/>
<text x="210" y="287" fill="#2878b5" text-anchor="middle">q ← q − step_size × slope</text>
<text x="210" y="309" fill="#2878b5" text-anchor="middle">k ← k + 1</text>
<line x1="62" y1="292" x2="20" y2="292" stroke="#2878b5" stroke-width="1.5" />
<line x1="20" y1="292" x2="20" y2="93" stroke="#2878b5" stroke-width="1.5" />
<line x1="20" y1="93" x2="62" y2="93" stroke="#2878b5" stroke-width="1.8" />
<path d="M 55.0,89.0 L 62,93 L 55.0,97.0" fill="none" stroke="#2878b5" stroke-width="1.8"/>
<text x="210" y="347" fill="#707070" text-anchor="middle">Repeat with the updated q</text>
</g></svg>
