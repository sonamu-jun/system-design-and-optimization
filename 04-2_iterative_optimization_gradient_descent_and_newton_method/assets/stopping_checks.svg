<svg xmlns="http://www.w3.org/2000/svg" width="480" height="192" viewBox="0 0 480 192" role="img">
<title>Three stopping situations have different meanings</title>
<rect width="480" height="192" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="14">
<rect x="8" y="12" width="464" height="46" rx="6" fill="white" stroke="#168578"/>
<text x="20" y="40" fill="#168578">Small gradient</text>
<text x="200" y="40" fill="#243344">Tolerance reached</text>
<rect x="8" y="72" width="464" height="46" rx="6" fill="white" stroke="#8854a5"/>
<text x="20" y="100" fill="#8854a5">Small move only</text>
<text x="200" y="100" fill="#243344">Step may be too small</text>
<rect x="8" y="132" width="464" height="46" rx="6" fill="white" stroke="#d47a20"/>
<text x="20" y="160" fill="#d47a20">Update limit</text>
<text x="200" y="160" fill="#243344">Work stopped; check gradient</text>
</g></svg>
