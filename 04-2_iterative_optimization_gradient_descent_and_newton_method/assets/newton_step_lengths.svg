<svg xmlns="http://www.w3.org/2000/svg" width="520" height="290" viewBox="0 0 520 290" role="img">
<title>From the same zero correction, GD moves 0.4, full Newton 1, and half Newton 0.5.</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="14" fill="#243344">
<line x1="219" y1="24" x2="219" y2="226" stroke="#d7dfe7" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="475" y1="24" x2="475" y2="226" stroke="#168578" stroke-width="1" stroke-dasharray="3 3"/>
<text x="16" y="46" fill="#243344" text-anchor="start">GD</text>
<text x="16" y="68" fill="#8854a5" text-anchor="start">α = 0.05</text>
<line x1="219" y1="48" x2="475" y2="48" stroke="#d7dfe7" stroke-width="1.5" />
<line x1="224" y1="48" x2="315.4" y2="48" stroke="#2878b5" stroke-width="1.8" />
<path d="M 308.4,44.0 L 315.4,48 L 308.4,52.0" fill="none" stroke="#2878b5" stroke-width="1.8"/>
<circle cx="219" cy="48" r="4.5" fill="#2878b5"/>
<circle cx="321.4" cy="48" r="4.5" fill="#d47a20"/>
<text x="321.4" y="36" fill="#d47a20" text-anchor="middle">q = 0.4</text>
<text x="321.4" y="72" fill="#707070" text-anchor="middle">f = 3.44</text>
<text x="16" y="124" fill="#243344" text-anchor="start">Full Newton</text>
<text x="16" y="146" fill="#8854a5" text-anchor="start">fraction = 1</text>
<line x1="219" y1="126" x2="475" y2="126" stroke="#d7dfe7" stroke-width="1.5" />
<line x1="224" y1="126" x2="469.0" y2="126" stroke="#2878b5" stroke-width="1.8" />
<path d="M 462.0,122.0 L 469.0,126 L 462.0,130.0" fill="none" stroke="#2878b5" stroke-width="1.8"/>
<circle cx="219" cy="126" r="4.5" fill="#2878b5"/>
<circle cx="475.0" cy="126" r="4.5" fill="#d47a20"/>
<text x="475.0" y="114" fill="#d47a20" text-anchor="middle">q = 1</text>
<text x="475.0" y="150" fill="#707070" text-anchor="middle">f = 2</text>
<text x="16" y="202" fill="#243344" text-anchor="start">Damped Newton</text>
<text x="16" y="224" fill="#8854a5" text-anchor="start">fraction = 0.5</text>
<line x1="219" y1="204" x2="475" y2="204" stroke="#d7dfe7" stroke-width="1.5" />
<line x1="224" y1="204" x2="341.0" y2="204" stroke="#2878b5" stroke-width="1.8" />
<path d="M 334.0,200.0 L 341.0,204 L 334.0,208.0" fill="none" stroke="#2878b5" stroke-width="1.8"/>
<circle cx="219" cy="204" r="4.5" fill="#2878b5"/>
<circle cx="347.0" cy="204" r="4.5" fill="#d47a20"/>
<text x="347.0" y="192" fill="#d47a20" text-anchor="middle">q = 0.5</text>
<text x="347.0" y="228" fill="#707070" text-anchor="middle">f = 3</text>
<text x="219" y="251" fill="#2878b5" text-anchor="middle">Start: 0</text>
<text x="475" y="251" fill="#168578" text-anchor="middle">Minimum: 1</text>
<text x="348" y="274" fill="#707070" text-anchor="middle">Correction q (min)</text>
</g></svg>
