<svg xmlns="http://www.w3.org/2000/svg" width="520" height="218" viewBox="0 0 520 218" role="img">
<title>At correction zero, four signed errors are squared and added to give score 6.</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="14" fill="#243344">
<text x="16" y="26" fill="#d47a20" text-anchor="start">q = 0 min</text>
<text x="188" y="26" fill="#707070" text-anchor="middle">i = 1</text>
<rect x="154" y="44" width="68" height="38" rx="7" stroke="#d7dfe7" fill="#f5f7fa"/>
<text x="188" y="68" fill="#243344" text-anchor="middle">−2</text>
<line x1="188" y1="87" x2="188" y2="112" stroke="#707070" stroke-width="1.8" />
<path d="M 192.0,105.0 L 188,112 L 184.0,105.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<rect x="154" y="119" width="68" height="38" rx="7" stroke="#2878b5" fill="#f2f7fb"/>
<text x="188" y="143" fill="#2878b5" text-anchor="middle">4</text>
<text x="277" y="26" fill="#707070" text-anchor="middle">i = 2</text>
<rect x="243" y="44" width="68" height="38" rx="7" stroke="#d7dfe7" fill="#f5f7fa"/>
<text x="277" y="68" fill="#243344" text-anchor="middle">−1</text>
<line x1="277" y1="87" x2="277" y2="112" stroke="#707070" stroke-width="1.8" />
<path d="M 281.0,105.0 L 277,112 L 273.0,105.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<rect x="243" y="119" width="68" height="38" rx="7" stroke="#2878b5" fill="#f2f7fb"/>
<text x="277" y="143" fill="#2878b5" text-anchor="middle">1</text>
<text x="366" y="26" fill="#707070" text-anchor="middle">i = 3</text>
<rect x="332" y="44" width="68" height="38" rx="7" stroke="#d7dfe7" fill="#f5f7fa"/>
<text x="366" y="68" fill="#243344" text-anchor="middle">−1</text>
<line x1="366" y1="87" x2="366" y2="112" stroke="#707070" stroke-width="1.8" />
<path d="M 370.0,105.0 L 366,112 L 362.0,105.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<rect x="332" y="119" width="68" height="38" rx="7" stroke="#2878b5" fill="#f2f7fb"/>
<text x="366" y="143" fill="#2878b5" text-anchor="middle">1</text>
<text x="455" y="26" fill="#707070" text-anchor="middle">i = 4</text>
<rect x="421" y="44" width="68" height="38" rx="7" stroke="#d7dfe7" fill="#f5f7fa"/>
<text x="455" y="68" fill="#243344" text-anchor="middle">0</text>
<line x1="455" y1="87" x2="455" y2="112" stroke="#707070" stroke-width="1.8" />
<path d="M 459.0,105.0 L 455,112 L 451.0,105.0" fill="none" stroke="#707070" stroke-width="1.8"/>
<rect x="421" y="119" width="68" height="38" rx="7" stroke="#2878b5" fill="#f2f7fb"/>
<text x="455" y="143" fill="#2878b5" text-anchor="middle">0</text>
<text x="16" y="68" fill="#243344" text-anchor="start">Errors (min)</text>
<text x="16" y="104" fill="#707070" text-anchor="start">Square each</text>
<text x="16" y="143" fill="#243344" text-anchor="start">Squared (min²)</text>
<text x="16" y="197" fill="#707070" text-anchor="start">Add all four</text>
<text x="326" y="197" fill="#243344" text-anchor="middle">4 + 1 + 1 + 0 = 6 min²</text>
</g></svg>
